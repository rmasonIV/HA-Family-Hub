name: Family Hub Live PR preview

on:
  pull_request:
    paths:
      - 'custom_components/family_hub/card/family-hub-live.js'
      - 'preview/live.html'
      - 'preview/appearance.test.cjs'
      - 'preview/package*.json'
      - '.github/workflows/live-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the current card and sample data
        run: |
          mkdir -p preview-build
          sed "s|../custom_components/family_hub/card/family-hub-live.js|./family-hub-live.js|" preview/live.html > preview-build/index.html
          cp custom_components/family_hub/card/family-hub-live.js preview-build/
          node --check preview-build/family-hub-live.js
          echo 'Download **family-hub-live-preview**, unzip it, and open `index.html` in your browser.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: family-hub-live-preview
          path: preview-build/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test calendar appearance in Chromium
        working-directory: preview
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
